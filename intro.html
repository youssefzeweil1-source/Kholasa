<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>معاينة شاشة الدخول | خلاصة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* صفحة المعاينة بس — متنقلهاش لموقعك */
  :root { --primary:#059669; --primary-light:#10b981; --primary-glow:rgba(16,185,129,.2); --bg-color:#f8fafc; --text-main:#0f172a; --text-muted:#64748b; }
  [data-theme="dark"] { --bg-color:#0f172a; --text-main:#f8fafc; --text-muted:#94a3b8; --primary-glow:rgba(16,185,129,.12); }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
  body { background:var(--bg-color); color:var(--text-main); display:grid; place-items:center; }
</style>
</head>
