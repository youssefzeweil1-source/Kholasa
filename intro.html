<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>معاينة شاشة الدخول | خلاصة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* صفحة المعاينة بس — متنقلهاش لموقعك */
  :root { --primary:#059669; --primary-light:#10b981; --primary-glow:rgba(16,185,129,.2); --bg-color:#f8fafc; --text-main:#0f172a; --text-muted:#64748b; }
  [data-theme="dark"] { --bg-color:#0f172a; --text-main:#f8fafc; --text-muted:#94a3b8; --primary-glow:rgba(16,185,129,.12); }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
  body { background:var(--bg-color); color:var(--text-main); display:grid; place-items:center; min-height:100vh; font-weight:700; }

  /* ===================================================================
     (1) الصق الـ CSS ده جوه <style> بتاعك (في الآخر)
     =================================================================== */
  body.intro-lock { overflow: hidden; }

  #intro {
    position: fixed; inset: 0; z-index: 5000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: radial-gradient(circle at 50% 42%, var(--primary-glow, rgba(16,185,129,.2)), var(--bg-color, #f8fafc) 62%);
    transition: opacity .8s ease, transform .8s ease, filter .8s ease;
    /* شبكة أمان: لو الجافاسكريبت فشل، الشاشة تختفي لوحدها */
    animation: introFailsafe .4s 9s forwards;
  }
  #intro.hide { opacity: 0; transform: scale(1.04); filter: blur(6px); pointer-events: none; }
  @keyframes introFailsafe { to { opacity: 0; visibility: hidden; pointer-events: none; } }

  #introSvg { width: min(86vw, 560px); height: auto; overflow: visible; cursor: pointer; }
  .intro-word { font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 150px; }
  .intro-word.ghost { fill: none; stroke: var(--primary, #059669); stroke-width: 2; opacity: 0; }
  #intro.play .intro-word.ghost { animation: fadeTo35 .6s ease forwards; }
  @keyframes fadeTo35 { to { opacity: .35; } }

  /* الملي اللي بيطلع جوه الكلمة (زي نبات بيكبر) */
  #introSvg .rise { transform: translateY(300px); }
  #intro.play .rise { animation: rise 2.4s cubic-bezier(.45,.05,.3,1) .2s forwards; }
  @keyframes rise { to { transform: translateY(36px); } }
  #intro.play .wave { animation: wave 1.8s linear infinite; }
  @keyframes wave { from { transform: translateX(-600px); } to { transform: translateX(0); } }

  /* العروق والورق الصغير جوه الحروف */
  #introSvg .vine { fill: none; stroke: #d1fae5; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: .85; }
  #intro.play .vine { animation: draw 1.6s ease-out forwards; animation-delay: var(--d, 1.4s); }
  #introSvg .vleaf { fill: #ecfdf5; opacity: .9; transform: scale(0); transform-box: fill-box; transform-origin: center; }
  #intro.play .vleaf { animation: pop .5s ease-out forwards; animation-delay: var(--d, 2s); }

  /* الشتلات اللي بتطلع من فوق الكلمة */
  #introSvg .stem { fill: none; stroke: #047857; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  #intro.play .stem { animation: draw 1.1s ease-out forwards; animation-delay: var(--d, 2.4s); }
  #introSvg .leaf { fill: #10b981; stroke: #047857; stroke-width: 1.5; transform: scale(0); }
  #intro.play .leaf { animation: pop .6s cubic-bezier(.3,1.6,.5,1) forwards; animation-delay: var(--d, 3.2s); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop  { 0% { transform: scale(0); } 100% { transform: scale(1); } }

  .intro-tag { font-size: 1.15rem; font-weight: 700; color: var(--text-muted, #64748b); letter-spacing: .5px; opacity: 0; transform: translateY(8px); }
  #intro.play .intro-tag { animation: tagIn .8s ease 3s forwards; }
  @keyframes tagIn { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) { #intro { display: none; } }
</style>
</head>
<body>

  <!-- ===================================================================
       (2) الصق الـ HTML ده بعد وسم <body> على طول
       =================================================================== -->
  <div id="intro" aria-hidden="true">
    <svg id="introSvg" viewBox="0 0 600 300" role="img" aria-label="خلاصة">
      <defs>
        <linearGradient id="introGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#34d399"/>
          <stop offset="1" stop-color="#047857"/>
        </linearGradient>
        <clipPath id="wordClip">
          <text id="clipText" class="intro-word" x="300" y="200" text-anchor="middle">خلاصة</text>
        </clipPath>
      </defs>

      <!-- شبح الكلمة (إطار خفيف) -->
      <text class="intro-word ghost" x="300" y="200" text-anchor="middle">خلاصة</text>

      <!-- الحشو الأخضر والنباتات جوه شكل الكلمة بس -->
      <g clip-path="url(#wordClip)">
        <g class="rise"><g class="wave">
          <path fill="url(#introGrad)" d="M0 12 Q75 -6 150 12 T300 12 T450 12 T600 12 T750 12 T900 12 T1050 12 T1200 12 V420 H0 Z"/>
        </g></g>

        <g>
          <path class="vine" pathLength="1" style="--d:1.5s" d="M110 190 C190 110 250 230 320 150 S430 110 490 170"/>
          <path class="vine" pathLength="1" style="--d:1.8s" d="M110 125 C200 200 260 95 335 180 S440 205 490 120"/>
          <path class="vine" pathLength="1" style="--d:2.1s" d="M130 160 C220 150 280 175 360 140 S450 150 480 135"/>
          <ellipse class="vleaf" style="--d:2.0s" cx="172" cy="148" rx="11" ry="5" transform="rotate(-35 172 148)"/>
          <ellipse class="vleaf" style="--d:2.2s" cx="252" cy="188" rx="11" ry="5" transform="rotate(25 252 188)"/>
          <ellipse class="vleaf" style="--d:2.4s" cx="322" cy="152" rx="11" ry="5" transform="rotate(-30 322 152)"/>
          <ellipse class="vleaf" style="--d:2.6s" cx="398" cy="128" rx="11" ry="5" transform="rotate(30 398 128)"/>
          <ellipse class="vleaf" style="--d:2.3s" cx="215" cy="172" rx="10" ry="4.5" transform="rotate(40 215 172)"/>
          <ellipse class="vleaf" style="--d:2.5s" cx="300" cy="170" rx="10" ry="4.5" transform="rotate(-20 300 170)"/>
          <ellipse class="vleaf" style="--d:2.7s" cx="440" cy="196" rx="10" ry="4.5" transform="rotate(35 440 196)"/>
          <ellipse class="vleaf" style="--d:2.8s" cx="420" cy="148" rx="10" ry="4.5" transform="rotate(-35 420 148)"/>
        </g>
      </g>

      <!-- الشتلات (بتتبني بالـ JS حسب مكان الحروف) -->
      <g id="sprouts"></g>
    </svg>
    <p class="intro-tag">دليلك الذكي للأعشاب</p>
  </div>

  <!-- ===================================================================
       (3) الصق الـ JS ده في آخر الـ <script> بتاعك (بعد renderHome())
       =================================================================== -->
  <script>
    (function () {
      const intro = document.getElementById('intro');
      if (!intro) return;

      // لو المستخدم مفعّل "تقليل الحركة" نتخطى الشاشة
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { intro.remove(); return; }

      document.body.classList.add('intro-lock');
      const NS = 'http://www.w3.org/2000/svg';
      let closed = false;

      function closeIntro() {
        if (closed) return;
        closed = true;
        intro.classList.add('hide');
        document.body.classList.remove('intro-lock');
        setTimeout(() => intro.remove(), 900);
      }
      intro.addEventListener('click', closeIntro); // اضغط في أي مكان للتخطي

      function make(tag, attrs) {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        return el;
      }

      // شتلة: ساق بتطلع من جوه الحرف + ورقتين فوق
      function addSprout(group, x, h, lean, delay) {
        const baseY = 150, tipY = baseY - h, tipX = x + lean;
        group.appendChild(make('path', {
          class: 'stem', pathLength: '1', style: `--d:${delay}s`,
          d: `M${x} ${baseY} C${x + lean / 2} ${baseY - h * 0.4} ${x - lean} ${baseY - h * 0.7} ${tipX} ${tipY}`
        }));
        const leafD = 'M0 0 C8 -16 30 -18 42 -4 C30 10 10 10 0 0Z';
        [[-38, 1], [-142, -1]].forEach(([rot, flip], i) => {
          const g = make('g', { transform: `translate(${tipX} ${tipY}) rotate(${rot})` });
          g.appendChild(make('path', {
            class: 'leaf', d: leafD,
            style: `--d:${delay + 0.9 + i * 0.15}s` + (flip === -1 ? ';' : '')
          }));
          group.appendChild(g);
        });
        // ورقة صغيرة في نص الساق
        const mid = make('g', { transform: `translate(${x + lean * 0.35} ${baseY - h * 0.55}) rotate(-20) scale(.6)` });
        mid.appendChild(make('path', { class: 'leaf', d: leafD, style: `--d:${delay + 0.7}s` }));
        group.appendChild(mid);
      }

      function buildSprouts() {
        const group = document.getElementById('sprouts');
        const t = document.getElementById('clipText');
        let xs = [];
        try {
          [1, 2].forEach(i => { const e = t.getExtentOfChar(i); if (e.width > 0) xs.push(e.x + e.width / 2); });
        } catch (e) { /* نستخدم أماكن احتياطية */ }
        if (xs.length < 2) xs = [415, 370];
        addSprout(group, xs[0], 92, -10, 2.5);
        addSprout(group, xs[1], 112, 12, 2.75);
      }

      function start() {
        buildSprouts();
        intro.classList.add('play');
        setTimeout(closeIntro, 5200);
      }

      // نستنى الخط يتحمل عشان أماكن الشتلات تطلع صح
      const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      Promise.race([fontsReady, new Promise(r => setTimeout(r, 1500))]).then(start);
    })();
  </script>
</body>
</html>
