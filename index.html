<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خلاصة | دليلك الشامل للأعشاب الطبيعية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-900: #1b3a2b; --green-700: #2d6a4f; --green-500: #40916c;
      --green-100: #d8f3dc; --cream: #fefae0; --text: #1f2937;
      --text-light: #6b7280; --white: #ffffff; --orange: #f59e0b;
      --blue-100: #e0f2fe; --blue-700: #0369a1; --blue-900: #0c4a6e;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --radius: 20px; --transition: all 0.3s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    body { background: var(--cream); color: var(--text); line-height: 1.6; }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

    .screen { display: none; padding: 40px 0; min-height: 100vh; }
    .screen.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .hero { text-align: center; padding: 60px 20px 40px; }
    .hero h1 { font-size: 2.5rem; color: var(--green-900); margin-bottom: 10px; }
    .hero p { color: var(--text-light); font-size: 1.1rem; }
    
    .category-title {
      font-size: 1.5rem; color: var(--green-900); margin: 40px 0 20px;
      border-right: 5px solid var(--green-500); padding-right: 15px;
      display: flex; align-items: center; gap: 10px;
    }

    .disease-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .disease-card {
      background: var(--white); padding: 25px 15px; border-radius: var(--radius);
      text-align: center; cursor: pointer; box-shadow: var(--shadow);
      transition: var(--transition); border: 2px solid transparent;
    }
    .disease-card:hover { transform: translateY(-5px); border-color: var(--green-500); }
    .disease-card .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .disease-card h3 { color: var(--green-900); font-size: 1.1rem; }

    .back-btn {
      display: inline-block; background: var(--white); color: var(--green-700);
      padding: 10px 20px; border-radius: 50px; font-weight: bold; cursor: pointer;
      box-shadow: var(--shadow); margin-bottom: 30px; border: none; font-size: 1rem;
    }
    .back-btn:hover { background: var(--green-100); }
    
    .disease-header { text-align: center; margin-bottom: 40px; }
    .disease-header h1 { font-size: 2.5rem; color: var(--green-900); margin-bottom: 10px; }
    .disease-header p { font-size: 1.1rem; color: var(--text-light); max-width: 700px; margin: 0 auto; }

    .herb-card {
      background: var(--white); border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow); margin-bottom: 30px; display: flex; flex-direction: column;
    }
    @media(min-width: 768px) { .herb-card { flex-direction: row; } }
    
    .herb-img-container {
      width: 100%; height: 250px; background: #e5e7eb;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .herb-img-container img { width: 100%; height: 100%; object-fit: cover; }
    .img-placeholder {
      text-align: center; color: var(--text-light); font-weight: bold; font-size: 1.1rem;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      background: #f3f4f6; width: 100%; height: 100%; justify-content: center;
    }
    .img-placeholder span { font-size: 2.5rem; }
    
    @media(min-width: 768px) { .herb-img-container { width: 300px; height: auto; min-height: 250px; flex-shrink: 0; } }

    .herb-info { padding: 30px; flex: 1; }
    .herb-info h2 { color: var(--green-700); font-size: 1.8rem; margin-bottom: 5px; }
    .herb-info .latin { font-style: italic; color: var(--text-light); font-size: 0.9rem; margin-bottom: 15px; display: block; }
    
    .section-title { color: var(--green-900); font-size: 1.1rem; margin-top: 20px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-weight: 800;}
    .herb-info p, .herb-info ul { color: var(--text-light); font-size: 0.95rem; }
    
    .info-box { padding: 15px; border-radius: 8px; margin-top: 15px; }
    .info-box h4 { margin-bottom: 5px; display: flex; align-items: center; gap: 5px;}
    
    .dosage-box { background: #f0fdf4; border-right: 4px solid var(--green-500); }
    .dosage-box h4 { color: var(--green-700); }
    .dosage-box p { color: var(--green-900); font-weight: bold; }

    .duration-box { background: var(--blue-100); border-right: 4px solid var(--blue-700); }
    .duration-box h4 { color: var(--blue-700); }
    .duration-box p { color: var(--blue-900); font-weight: bold; }

    .location-box { background: #f8fafc; border: 1px solid #e2e8f0; }
    .location-box h4 { color: var(--green-700); }
    .location-box p { margin-bottom: 5px; font-size: 0.9rem; color: var(--text); }
    .location-box strong { color: var(--green-900); }

    .warning-box { background: #fff7ed; border-right: 4px solid var(--orange); }
    .warning-box h4 { color: #b45309; }
    .warning-box ul { color: #92400e; padding-right: 20px; list-style: disc; margin-top: 5px; }

    footer { text-align: center; padding: 30px; color: var(--text-light); font-size: 0.9rem; }
  </style>
</head>
<body>

  <div id="home-screen" class="screen active">
    <div class="container">
      <div class="hero">
        <h1>إيه اللي حاسس بيه؟</h1>
        <p>دليلك الشامل لأفضل الأعشاب الطبيعية، الجرعات، ومدة العلاج.</p>
      </div>
      <div id="categoriesContainer"></div>
    </div>
    <footer>© 2026 خلاصة. صُنع بحب من الحديقة إلى المعمل 🌿</footer>
  </div>

  <div id="disease-screen" class="screen">
    <div class="container">
      <button class="back-btn" onclick="goHome()">← رجوع للقائمة</button>
      <div class="disease-header">
        <h1 id="diseaseTitle"></h1>
        <p id="diseaseDesc"></p>
      </div>
      <div id="remediesContainer"></div>
    </div>
    <footer>© 2026 خلاصة. صُنع بحب من الحديقة إلى المعمل 🌿</footer>
  </div>

  <!-- ربط ملف البيانات -->
  <script src="data.js"></script>
  
  <script>
    const categoriesContainer = document.getElementById('categoriesContainer');
    const homeScreen = document.getElementById('home-screen');
    const diseaseScreen = document.getElementById('disease-screen');
    const diseaseTitle = document.getElementById('diseaseTitle');
    const diseaseDesc = document.getElementById('diseaseDesc');
    const remediesContainer = document.getElementById('remediesContainer');

    const groupedConditions = {};
    healthConditions.forEach(condition => {
      if (!groupedConditions[condition.category]) {
        groupedConditions[condition.category] = [];
      }
      groupedConditions[condition.category].push(condition);
    });

    for (const category in groupedConditions) {
      const catTitle = document.createElement('h2');
      catTitle.className = 'category-title';
      catTitle.innerHTML = `🌿 ${category}`;
      categoriesContainer.appendChild(catTitle);

      const grid = document.createElement('div');
      grid.className = 'disease-grid';

      groupedConditions[category].forEach(condition => {
        const card = document.createElement('div');
        card.className = 'disease-card';
        card.innerHTML = `
          <div class="icon">${condition.icon}</div>
          <h3>${condition.name}</h3>
        `;
        card.onclick = () => showDisease(condition);
        grid.appendChild(card);
      });

      categoriesContainer.appendChild(grid);
    }

    function showDisease(condition) {
      diseaseTitle.textContent = condition.name;
      diseaseDesc.textContent = condition.desc;
      
      remediesContainer.innerHTML = '';
      condition.remedies.forEach(remedy => {
        const card = document.createElement('div');
        card.className = 'herb-card';
        
        const placeholder = `<div class="img-placeholder"><span>📸</span>مكان مخصص لصورة<br>${remedy.name}</div>`;
        
        card.innerHTML = `
          <div class="herb-img-container">
            <img src="${remedy.img}" alt="${remedy.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='${placeholder}';">
          </div>
          <div class="herb-info">
            <h2>${remedy.name}</h2>
            <span class="latin">${remedy.latin}</span>
            
            <div class="section-title">💡 إزاي بيعالج؟</div>
            <p>${remedy.how}</p>
            
            <div class="info-box dosage-box">
              <h4>☕ الجرعة والاستخدام</h4>
              <p>${remedy.dosage}</p>
            </div>

            <div class="info-box duration-box">
              <h4>⏳ مدة العلاج المتوقعة</h4>
              <p>${remedy.duration}</p>
            </div>

            <div class="info-box location-box">
              <h4>📍 أماكن الزراعة والتوفر</h4>
              <p><strong>🌍 الدول المشهورة:</strong> ${remedy.location.world}</p>
              <p><strong>🇪🇬 في مصر:</strong> ${remedy.location.egypt}</p>
              <p><strong>🛒 هتلاقيها فين:</strong> ${remedy.location.where}</p>
            </div>
            
            <div class="info-box warning-box">
              <h4>⚠️ تحذيرات مهمة</h4>
              <ul>${remedy.warnings.map(w => `<li>${w}</li>`).join('')}</ul>
            </div>
          </div>
        `;
        remediesContainer.appendChild(card);
      });

      homeScreen.classList.remove('active');
      diseaseScreen.classList.add('active');
      window.scrollTo(0, 0);
    }

    function goHome() {
      diseaseScreen.classList.remove('active');
      homeScreen.classList.add('active');
      window.scrollTo(0, 0);
    }
  </script>

</body>
</html>
