<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>خلاصة 2.0 | دليلك الذكي للأعشاب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#059669;--primary-light:#10b981;--primary-glow:rgba(16,185,129,.2);--bg-color:#f8fafc;--surface:#fff;--text-main:#0f172a;--text-muted:#64748b;--accent:#f59e0b;--accent-bg:#fffbeb;--border:#e2e8f0;--danger:#ef4444;--shadow-sm:0 1px 3px rgba(0,0,0,.05);--shadow-md:0 4px 6px -1px rgba(0,0,0,.1);--radius:16px;--transition:all .3s ease}
[data-theme="dark"]{--bg-color:#0f172a;--surface:#1e293b;--text-main:#f8fafc;--text-muted:#94a3b8;--border:#334155;--accent-bg:#451a03;--primary-glow:rgba(16,185,129,.1)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg-color);color:var(--text-main);line-height:1.6;transition:var(--transition)}
header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);z-index:1000;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-sm);flex-wrap:wrap;gap:15px}
.logo{font-size:1.5rem;font-weight:900;color:var(--primary);display:flex;align-items:center;gap:8px;cursor:pointer}
.header-tools{display:flex;gap:10px;align-items:center;flex:1;justify-content:flex-end;flex-wrap:wrap}
.search-box{padding:10px 15px;border-radius:50px;border:1px solid var(--border);background:var(--bg-color);color:var(--text-main);outline:none;width:100%;max-width:350px;transition:var(--transition)}
.search-box:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-glow)}
.icon-btn{background:var(--bg-color);border:1px solid var(--border);color:var(--text-main);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.icon-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.icon-btn.active{background:var(--danger);color:#fff;border-color:var(--danger)}
.screen{display:none;padding-top:30px;padding-bottom:50px;min-height:80vh}
.screen.active{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.container{max-width:1100px;margin:0 auto;padding:0 20px}
.disclaimer{background:var(--accent-bg);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:.9rem}
.filters-container{display:flex;gap:10px;margin-bottom:30px;justify-content:center;flex-wrap:wrap}
.filter-btn{padding:8px 20px;border-radius:50px;border:1px solid var(--border);background:var(--surface);color:var(--text-main);cursor:pointer;font-weight:700;transition:var(--transition)}
.filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.category-title{font-size:1.6rem;font-weight:800;margin:40px 0 20px;display:flex;align-items:center;gap:10px}
.category-title::before{content:'';width:6px;height:25px;background:var(--primary);border-radius:10px}
.disease-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.disease-card{background:var(--surface);border-radius:var(--radius);padding:25px;text-align:center;cursor:pointer;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:var(--transition)}
.disease-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);border-color:var(--primary)}
.disease-card .icon{font-size:2.5rem;margin-bottom:10px}
.disease-card h3{font-size:1.1rem;font-weight:700}
.back-btn{background:var(--surface);border:1px solid var(--border);padding:10px 20px;border-radius:50px;cursor:pointer;font-weight:700;color:var(--primary);margin-bottom:30px;transition:var(--transition)}
.back-btn:hover{background:var(--primary);color:#fff}
.herb-card{background:var(--surface);border-radius:var(--radius);padding:25px;margin-bottom:30px;box-shadow:var(--shadow-md);border:1px solid var(--border)}
.herb-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px;gap:10px}
.herb-title{display:flex;align-items:center;gap:14px}
.herb-img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--primary-light)}
.herb-placeholder{display:flex;align-items:center;justify-content:center;background:var(--primary-glow);font-size:1.8rem;flex:none}
.herb-info h2{color:var(--primary);font-size:1.5rem}
.latin{font-style:italic;color:var(--text-muted);font-size:.9rem}
.herb-actions{display:flex;gap:10px}
.action-btn{background:var(--bg-color);border:1px solid var(--border);width:35px;height:35px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:var(--transition)}
.action-btn.fav.active{background:#fee2e2;color:var(--danger);border-color:var(--danger)}
.action-btn.comp.active{background:#e0f2fe;color:#0369a1;border-color:#0369a1}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.badge{font-size:.8rem;padding:3px 10px;border-radius:50px;background:var(--bg-color);border:1px solid var(--border);font-weight:600}
.info-box{padding:15px;border-radius:8px;margin-top:15px;background:var(--bg-color);border-right:4px solid var(--primary)}
.info-box.warning{border-right-color:var(--accent);background:var(--accent-bg)}
.info-box.danger{border-right-color:var(--danger)}
.info-box.plant{border-right-color:#8b5cf6;background:#f5f3ff;color:#4c1d95}
.info-box h4{margin-bottom:5px;font-size:1rem}
.info-box ul{padding-right:20px}
.compare-bar{position:fixed;bottom:-100px;left:0;right:0;background:var(--surface);padding:15px;box-shadow:0 -4px 10px rgba(0,0,0,.1);display:flex;justify-content:center;gap:20px;transition:var(--transition);z-index:1000;border-top:1px solid var(--border)}
.compare-bar.show{bottom:0}
.compare-btn{background:var(--primary);color:#fff;padding:10px 30px;border-radius:50px;border:none;font-weight:700;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:2000;backdrop-filter:blur(5px)}
.modal.show{display:flex}
.modal-content{background:var(--surface);padding:30px;border-radius:var(--radius);max-width:800px;width:90%;max-height:90vh;overflow-y:auto;position:relative}
.close-modal{position:absolute;top:15px;left:15px;font-size:1.5rem;cursor:pointer;color:var(--text-muted);border:none;background:none}
.compare-table{width:100%;border-collapse:collapse;margin-top:20px}
.compare-table th,.compare-table td{padding:12px;border:1px solid var(--border);text-align:right;font-size:.95rem}
.compare-table th{background:var(--bg-color);color:var(--primary)}
.calc-input{padding:10px;border-radius:8px;border:1px solid var(--border);width:100%;margin-bottom:15px;background:var(--bg-color);color:var(--text-main)}
.calc-result{background:#ecfdf5;color:#064e3b;padding:15px;border-radius:8px;font-weight:700;display:none;margin-top:20px}
@media(max-width:768px){header{flex-direction:column;align-items:stretch;padding:15px}.header-tools{flex-direction:column;align-items:stretch;width:100%;gap:15px}.search-box{max-width:100%;order:-1}.icon-btn{width:100%;border-radius:12px;height:45px;font-size:1.3rem}}
body.intro-lock { overflow: hidden; }

  #intro {
    position: fixed; inset: 0; z-index: 5000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: radial-gradient(circle at 50% 42%, var(--primary-glow, rgba(16,185,129,.2)), transparent 62%), var(--bg-color, #f8fafc);
    transition: opacity .8s ease, transform .8s ease, filter .8s ease;
    /* شبكة أمان: لو الجافاسكريبت فشل، الشاشة تختفي لوحدها */
    animation: introFailsafe .4s 9s forwards;
  }
  #intro.hide { opacity: 0; transform: scale(1.04); filter: blur(6px); pointer-events: none; }
  @keyframes introFailsafe { to { opacity: 0; visibility: hidden; pointer-events: none; } }

  #introSvg { width: min(86vw, 560px); height: auto; overflow: visible; cursor: pointer; }
  .intro-word { font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 150px; }
  .intro-word.ghost { fill: none; stroke: var(--primary, #059669); stroke-width: 2; opacity: 0; }
  #intro.play .intro-word.ghost { animation: fadeTo35 .6s ease forwards; }
  @keyframes fadeTo35 { to { opacity: .35; } }

  /* الملي اللي بيطلع جوه الكلمة (زي نبات بيكبر) */
  #introSvg .rise { transform: translateY(300px); }
  #intro.play .rise { animation: rise 2.4s cubic-bezier(.45,.05,.3,1) .2s forwards; }
  @keyframes rise { to { transform: translateY(36px); } }
  #intro.play .wave { animation: wave 1.8s linear infinite; }
  @keyframes wave { from { transform: translateX(-600px); } to { transform: translateX(0); } }

  /* العروق والورق الصغير جوه الحروف */
  #introSvg .vine { fill: none; stroke: #d1fae5; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: .85; }
  #intro.play .vine { animation: draw 1.6s ease-out forwards; animation-delay: var(--d, 1.4s); }
  #introSvg .vleaf { fill: #ecfdf5; opacity: .9; transform: scale(0); transform-box: fill-box; transform-origin: center; }
  #intro.play .vleaf { animation: pop .5s ease-out forwards; animation-delay: var(--d, 2s); }

  /* الشتلات اللي بتطلع من فوق الكلمة */
  #introSvg .stem { fill: none; stroke: #047857; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  #intro.play .stem { animation: draw 1.1s ease-out forwards; animation-delay: var(--d, 2.4s); }
  #introSvg .leaf { fill: #10b981; stroke: #047857; stroke-width: 1.5; transform: scale(0); }
  #intro.play .leaf { animation: pop .6s cubic-bezier(.3,1.6,.5,1) forwards; animation-delay: var(--d, 3.2s); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop  { 0% { transform: scale(0); } 100% { transform: scale(1); } }

  .intro-tag { font-size: 1.15rem; font-weight: 700; color: var(--text-muted, #64748b); letter-spacing: .5px; opacity: 0; transform: translateY(8px); }
  #intro.play .intro-tag { animation: tagIn .8s ease 3s forwards; }
  @keyframes tagIn { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) { #intro { display: none; } }
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
    <svg id="introSvg" viewBox="0 0 600 300" role="img" aria-label="خلاصة">
      <defs>
        <linearGradient id="introGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#34d399"/>
          <stop offset="1" stop-color="#047857"/>
        </linearGradient>
        <clipPath id="wordClip">
          <text id="clipText" class="intro-word" x="300" y="200" text-anchor="middle">خلاصة</text>
        </clipPath>
      </defs>

      <!-- شبح الكلمة (إطار خفيف) -->
      <text class="intro-word ghost" x="300" y="200" text-anchor="middle">خلاصة</text>

      <!-- الحشو الأخضر والنباتات جوه شكل الكلمة بس -->
      <g clip-path="url(#wordClip)">
        <g class="rise"><g class="wave">
          <path fill="url(#introGrad)" d="M0 12 Q75 -6 150 12 T300 12 T450 12 T600 12 T750 12 T900 12 T1050 12 T1200 12 V420 H0 Z"/>
        </g></g>

        <g>
          <path class="vine" pathLength="1" style="--d:1.5s" d="M110 190 C190 110 250 230 320 150 S430 110 490 170"/>
          <path class="vine" pathLength="1" style="--d:1.8s" d="M110 125 C200 200 260 95 335 180 S440 205 490 120"/>
          <path class="vine" pathLength="1" style="--d:2.1s" d="M130 160 C220 150 280 175 360 140 S450 150 480 135"/>
          <ellipse class="vleaf" style="--d:2.0s" cx="172" cy="148" rx="11" ry="5" transform="rotate(-35 172 148)"/>
          <ellipse class="vleaf" style="--d:2.2s" cx="252" cy="188" rx="11" ry="5" transform="rotate(25 252 188)"/>
          <ellipse class="vleaf" style="--d:2.4s" cx="322" cy="152" rx="11" ry="5" transform="rotate(-30 322 152)"/>
          <ellipse class="vleaf" style="--d:2.6s" cx="398" cy="128" rx="11" ry="5" transform="rotate(30 398 128)"/>
          <ellipse class="vleaf" style="--d:2.3s" cx="215" cy="172" rx="10" ry="4.5" transform="rotate(40 215 172)"/>
          <ellipse class="vleaf" style="--d:2.5s" cx="300" cy="170" rx="10" ry="4.5" transform="rotate(-20 300 170)"/>
          <ellipse class="vleaf" style="--d:2.7s" cx="440" cy="196" rx="10" ry="4.5" transform="rotate(35 440 196)"/>
          <ellipse class="vleaf" style="--d:2.8s" cx="420" cy="148" rx="10" ry="4.5" transform="rotate(-35 420 148)"/>
        </g>
      </g>

      <!-- الشتلات (بتتبني بالـ JS حسب مكان الحروف) -->
      <g id="sprouts"></g>
    </svg>
    <p class="intro-tag">دليلك الذكي للأعشاب</p>
  </div>

<header>
  <div class="logo" onclick="goHome()"><span>🌿</span> خلاصة 2.0</div>
  <div class="header-tools">
    <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن مرض، عشبة، أو عَرَض..." oninput="handleSearch()">
    <div style="display:flex;gap:10px;width:100%;justify-content:space-between">
      <button class="icon-btn" onclick="togglePregnancy()" id="pregBtn" title="وضع الحمل والرضاعة" style="flex:1">🤰</button>
      <button class="icon-btn" onclick="showFavoritesScreen()" title="المفضلة" style="flex:1">❤️</button>
      <button class="icon-btn" onclick="toggleDarkMode()" title="الوضع الليلي" style="flex:1">🌙</button>
    </div>
  </div>
</header>

<div id="home-screen" class="screen active"><div class="container">
  <div class="disclaimer" id="disclaimer"></div>
  <div class="filters-container">
    <button class="filter-btn active" onclick="setFilter('all',this)">كل الأعشاب</button>
    <button class="filter-btn" onclick="setFilter('egyptian',this)">🇪🇬 أعشاب مصرية</button>
    <button class="filter-btn" onclick="setFilter('global',this)">🌍 أعشاب عالمية</button>
    <button class="filter-btn" onclick="showBlends()">🍵 الخلطات الجاهزة</button>
    <button class="filter-btn" onclick="showCalculator()">🧮 حاسبة الأطفال</button>
  </div>
  <div id="categoriesContainer"></div>
</div></div>

<div id="disease-screen" class="screen"><div class="container">
  <button class="back-btn" onclick="goHome()">← رجوع للقائمة</button>
  <div style="text-align:center;margin-bottom:30px">
    <h1 id="diseaseTitle" style="font-size:2.5rem;font-weight:900"></h1>
    <p id="diseaseDesc" style="color:var(--text-muted)"></p>
  </div>
  <div id="remediesContainer"></div>
</div></div>

<div id="favorites-screen" class="screen"><div class="container">
  <button class="back-btn" onclick="goHome()">← رجوع للرئيسية</button>
  <h1 style="font-size:2rem;margin-bottom:20px">❤️ قائمة المفضلة</h1>
  <div id="favoritesContainer"></div>
</div></div>

<div id="compareBar" class="compare-bar">
  <span id="compareText" style="font-weight:700;align-self:center"></span>
  <button class="compare-btn" onclick="openCompareModal()">قارن الآن ⚖️</button>
  <button class="icon-btn" onclick="clearCompare()">✖</button>
</div>

<div id="compareModal" class="modal"><div class="modal-content">
  <button class="close-modal" onclick="closeModal('compareModal')">✖</button>
  <h2 style="color:var(--primary);margin-bottom:20px">⚖️ مقارنة الأعشاب</h2>
  <div id="compareTableContainer" style="overflow-x:auto"></div>
</div></div>

<div id="calcModal" class="modal"><div class="modal-content">
  <button class="close-modal" onclick="closeModal('calcModal')">✖</button>
  <h2 style="color:var(--primary);margin-bottom:20px">🧮 حاسبة جرعات الأطفال</h2>
  <p style="margin-bottom:15px;font-size:.9rem;color:var(--text-muted)">تقدير تقريبي جداً. استشر الدكتور دائماً.</p>
  <input type="number" id="childAge" class="calc-input" placeholder="سن الطفل بالسنين (مثال: 6)" min="0" step="0.5">
  <input type="number" id="childWeight" class="calc-input" placeholder="وزن الطفل بالكيلوجرام (مثال: 15)" min="0">
  <button class="compare-btn" style="width:100%" onclick="calculateDose()">احسب الجرعة</button>
  <div id="calcResult" class="calc-result"></div>
</div></div>

<script src="data.js"></script>
<script>
let filter='all',isPregnant=false,compareList=[];
const FAV_KEY='kholasa_favs_v3';
let favorites=[];
try{favorites=JSON.parse(localStorage.getItem(FAV_KEY)||'[]');if(!Array.isArray(favorites))favorites=[]}catch{favorites=[]}
const $=id=>document.getElementById(id);
const showScreen=id=>{['home-screen','disease-screen','favorites-screen'].forEach(s=>$(s).classList.toggle('active',s===id));window.scrollTo(0,0)};
if(typeof GENERAL_DISCLAIMER==='undefined'||!Array.isArray(HEALTH_CONDITIONS)||typeof HERBS!=='object'){
  $('disclaimer').textContent='⚠️ تعذر تحميل بيانات الموقع. حدّث الصفحة أو جرّب فتحها مرة أخرى.';
  $('categoriesContainer').innerHTML='<h2 style="text-align:center;color:var(--danger);margin-top:50px">البيانات غير متاحة حاليًا.</h2>';
  throw new Error('Kholasa data failed to load');
}
$('disclaimer').textContent='⚠️ '+GENERAL_DISCLAIMER;

function toggleDarkMode(){
  const dark=document.body.getAttribute('data-theme')==='dark';
  if(dark)document.body.removeAttribute('data-theme');else document.body.setAttribute('data-theme','dark');
  localStorage.setItem('theme',dark?'light':'dark');
}
if(localStorage.getItem('theme')==='dark')document.body.setAttribute('data-theme','dark');

function togglePregnancy(){
  isPregnant=!isPregnant;
  $('pregBtn').classList.toggle('active',isPregnant);
  if(isPregnant)alert('تم تفعيل وضع الحمل. هيتعرض بس الأعشاب الآمنة غالباً بالجرعات العادية، وده مش بديل لاستشارة الدكتور.');
  renderHome();
  if($('disease-screen').classList.contains('active'))showScreen('home-screen');
}

const remedyList=cid=>getRemedies(cid,{egyptianOnly:filter==='egyptian',pregnancySafe:isPregnant})
  .filter(r=>filter!=='global'||r.egypt===null);

function createDiseaseCard(c){
  const d=document.createElement('div');d.className='disease-card';
  d.innerHTML=`<div class="icon">${c.icon}</div><h3>${c.name}</h3>`;
  d.onclick=()=>showDisease(c.id);return d;
}
function fillGrid(container,title,list){
  const t=document.createElement('h2');t.className='category-title';t.textContent=title;container.appendChild(t);
  const g=document.createElement('div');g.className='disease-grid';
  list.forEach(c=>g.appendChild(createDiseaseCard(c)));container.appendChild(g);
}

function renderHome(){
  const box=$('categoriesContainer');box.innerHTML='';$('searchInput').value='';
  const active=filter!=='all'||isPregnant;
  const grouped={};
  HEALTH_CONDITIONS.forEach(c=>{
    if(active&&remedyList(c.id).length===0)return;
    (grouped[c.category]=grouped[c.category]||[]).push(c);
  });
  const cats=Object.keys(grouped);
  if(!cats.length)box.innerHTML='<h2 style="text-align:center;color:var(--text-muted);margin-top:50px">مفيش نتايج مناسبة للفلتر ده.</h2>';
  cats.forEach(cat=>fillGrid(box,cat,grouped[cat]));
}

function handleSearch(){
  const q=$('searchInput').value.toLowerCase().trim();
  if(!q){renderHome();return}
  const box=$('categoriesContainer');box.innerHTML='';
  const res=HEALTH_CONDITIONS.filter(c=>
    c.name.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q)||
    c.remedies.some(r=>{const h=HERBS[r.herb];return h.name.toLowerCase().includes(q)||h.latin.toLowerCase().includes(q)||r.how.toLowerCase().includes(q)}));
  if(!res.length)box.innerHTML='<h2 style="text-align:center;color:var(--text-muted);margin-top:50px">مفيش نتايج مطابقة لبحثك 😔</h2>';
  else fillGrid(box,'نتائج البحث',res);
}

function setFilter(type,btn){
  filter=type;
  document.querySelectorAll('.filters-container .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');renderHome();
}

function herbCard(r,cid){
  const fav=favorites.includes(r.herbId),comp=compareList.some(x=>x.h===r.herbId&&x.c===cid),p=PREGNANCY[r.pregnancy];
  const plant=r.planting?`🌱 موعد الزراعة: ${r.planting}`:'🌱 مش بتتزرع تجارياً في مصر';
  const image=r.img?`<img class="herb-img" src="${r.img}" alt="${r.name}">`:'<div class="herb-img herb-placeholder" aria-hidden="true">🌿</div>';
  return `<div class="herb-card">
    <div class="herb-header">
      <div class="herb-title">${image}
        <div class="herb-info"><h2>${r.name}</h2><span class="latin">${r.latin}</span></div></div>
      <div class="herb-actions">
        <button class="action-btn fav ${fav?'active':''}" onclick="toggleFav('${r.herbId}',this)">❤️</button>
        <button class="action-btn comp ${comp?'active':''}" onclick="toggleCompare('${r.herbId}','${cid}',this)">⚖️</button>
      </div>
    </div>
    <div class="badges"><span class="badge">${p.icon} ${p.label}</span><span class="badge">🔬 ${EVIDENCE[r.evidence]}</span><span class="badge">${r.egypt!==null?'🇪🇬 بتزرع في مصر':'🌍 مستوردة'}</span></div>
    <p><strong>💡 إزاي بيساعد؟</strong> ${r.how}</p>
    <div class="info-box"><h4>☕ الجرعة والاستخدام</h4><p>${r.dosage}</p></div>
    <div class="info-box"><h4>⏳ المدة المتوقعة</h4><p>${r.duration}</p></div>
    <div class="info-box plant"><h4>${plant}</h4>
      <p><strong>🌍 أصلها:</strong> ${r.origin} | <strong>🇪🇬 مصر:</strong> ${r.egypt||'مستوردة'}</p>
      <p><strong>🛒 هتلاقيها فين:</strong> ${r.where}</p></div>
    <div class="info-box warning"><h4>⚠️ تحذيرات مهمة</h4><ul>${r.warnings.map(w=>`<li>${w}</li>`).join('')}</ul></div>
  </div>`;
}

function showDisease(cid){
  const c=HEALTH_CONDITIONS.find(x=>x.id===cid);
  $('diseaseTitle').textContent=c.name;$('diseaseDesc').textContent=c.desc;
  const box=$('remediesContainer');let html='';
  if(c.seeDoctor)html+=`<div class="info-box danger"><h4>🩺 امتى تروح للدكتور؟</h4><p>${c.seeDoctor}</p></div>`;
  if(c.note)html+=`<div class="info-box"><h4>💡 ملحوظة</h4><p>${c.note}</p></div>`;
  const list=remedyList(cid);
  html+='<div style="margin-top:25px">'+list.map(r=>herbCard(r,cid)).join('')+'</div>';
  if(!list.length&&c.remedies.length)html+='<h3 style="text-align:center;color:var(--danger);margin-top:40px">مفيش أعشاب مناسبة للفلتر المختار في القسم ده.</h3>';
  box.innerHTML=html;showScreen('disease-screen');
}

function toggleFav(id,btn){
  favorites=favorites.includes(id)?favorites.filter(f=>f!==id):[...favorites,id];
  btn.classList.toggle('active',favorites.includes(id));
  localStorage.setItem(FAV_KEY,JSON.stringify(favorites));
}
function showFavoritesScreen(){
  const box=$('favoritesContainer');
  if(!favorites.length)box.innerHTML='<h3 style="color:var(--text-muted);text-align:center;margin-top:50px">مفيش أعشاب في المفضلة لسه. اضغط على القلب ❤️ جوه أي عشبة عشان تحفظها هنا.</h3>';
  else box.innerHTML=favorites.filter(id=>HERBS[id]).map(id=>{
    const h=HERBS[id];
    const rem=HEALTH_CONDITIONS.flatMap(c=>c.remedies).find(r=>r.herb===id);
    return `<div class="herb-card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div class="herb-title"><div class="herb-img herb-placeholder" aria-hidden="true">🌿</div>
      <div class="herb-info"><h2>${h.name}</h2><p style="font-size:.9rem;color:var(--text-muted)">${rem?rem.how:''}</p></div></div>
      <button class="action-btn fav active" onclick="toggleFav('${id}',this);showFavoritesScreen()">❤️</button></div>`;
  }).join('');
  showScreen('favorites-screen');
}

function updateCompareBar(){
  $('compareBar').classList.toggle('show',compareList.length>0);
  $('compareText').textContent=compareList.length===1?'اختار عشبة تانية للمقارنة':'تم تحديد عشبتين للمقارنة';
}
function toggleCompare(h,c,btn){
  const i=compareList.findIndex(x=>x.h===h&&x.c===c);
  if(i>=0){compareList.splice(i,1);btn.classList.remove('active')}
  else{
    if(compareList.length>=2){alert('يمكنك مقارنة عشبتين فقط في نفس الوقت.');return}
    compareList.push({h,c});btn.classList.add('active');
  }
  updateCompareBar();
}
function clearCompare(){
  compareList=[];document.querySelectorAll('.action-btn.comp').forEach(b=>b.classList.remove('active'));updateCompareBar();
}
function openCompareModal(){
  if(compareList.length<2){alert('اختار عشبتين الأول.');return}
  const [a,b]=compareList.map(x=>getRemedies(x.c).find(r=>r.herbId===x.h));
  const row=(label,f)=>`<tr><td>${label}</td><td>${f(a)}</td><td>${f(b)}</td></tr>`;
  $('compareTableContainer').innerHTML=`<table class="compare-table">
    <tr><th>وجه المقارنة</th><th>${a.name}</th><th>${b.name}</th></tr>
    ${row('الاستخدام',r=>r.how)}${row('الجرعة',r=>r.dosage)}${row('المدة',r=>r.duration)}
    ${row('قوة الدليل',r=>EVIDENCE[r.evidence])}${row('الحمل',r=>PREGNANCY[r.pregnancy].icon+' '+PREGNANCY[r.pregnancy].label)}
    ${row('التحذيرات',r=>r.warnings.join('، '))}</table>`;
  $('compareModal').classList.add('show');
}

function showCalculator(){$('calcModal').classList.add('show')}
function calculateDose(){
  const age=parseFloat($('childAge').value),w=parseFloat($('childWeight').value),box=$('calcResult');
  if(isNaN(age)||age<0||!w||w<=0)return alert('أدخل السن والوزن بشكل صحيح');
  box.style.display='block';
  if(age<2){
    box.innerHTML='🚫 <strong>الأعشاب مش مناسبة للأطفال أقل من سنتين</strong> إلا بإشراف دكتور أطفال. مفيش جرعة منزلية آمنة نحسبها.';
    return;
  }
  const pct=Math.min(w/70,1)*100;
  box.innerHTML=`<p>⚠️ <strong>تقدير تقريبي جداً</strong> بالوزن بس، ومش بيراعي السن أو الحالة أو العشبة.</p>
    <p style="margin-top:10px">لطفل وزنه ${w} كجم: حوالي <strong>${pct.toFixed(0)}%</strong> من جرعة الكبار كحد أقصى.</p>
    <p style="margin-top:10px;color:var(--danger)">متديش أي عشب لطفل من غير استشارة الدكتور، وخصوصاً الزيوت المركزة والملينات.</p>`;
}

function showBlends(){
  const box=$('categoriesContainer');
  box.innerHTML='<h2 class="category-title">🍵 خلطات جاهزة</h2>'+BLENDS.map(b=>`
    <div class="herb-card"><h2 style="color:var(--primary);margin-bottom:10px">${b.icon} ${b.name}</h2>
      <p style="margin:10px 0"><strong>المكونات:</strong> ${b.herbs.map(id=>HERBS[id].name).concat(b.extras).join(' + ')}</p>
      <p style="margin-bottom:10px">${b.desc}</p>
      <div class="info-box"><h4>طريقة التحضير</h4><p>${b.howTo}</p></div>
      <div class="info-box warning"><h4>⚠️ تحذيرات</h4><ul>${b.warnings.map(w=>`<li>${w}</li>`).join('')}</ul></div></div>`).join('');
}

function goHome(){showScreen('home-screen');renderHome()}
function closeModal(id){$(id).classList.remove('show')}

renderHome();
</script>
<script>
(function () {
      const intro = document.getElementById('intro');
      if (!intro) return;

      // لو المستخدم مفعّل "تقليل الحركة" نتخطى الشاشة
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { intro.remove(); return; }

      document.body.classList.add('intro-lock');
      const NS = 'http://www.w3.org/2000/svg';
      let closed = false;

      function closeIntro() {
        if (closed) return;
        closed = true;
        intro.classList.add('hide');
        document.body.classList.remove('intro-lock');
        setTimeout(() => intro.remove(), 900);
      }
      intro.addEventListener('click', closeIntro); // اضغط في أي مكان للتخطي

      function make(tag, attrs) {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        return el;
      }

      // شتلة: ساق بتطلع من جوه الحرف + ورقتين فوق
      function addSprout(group, x, h, lean, delay) {
        const baseY = 150, tipY = baseY - h, tipX = x + lean;
        group.appendChild(make('path', {
          class: 'stem', pathLength: '1', style: `--d:${delay}s`,
          d: `M${x} ${baseY} C${x + lean / 2} ${baseY - h * 0.4} ${x - lean} ${baseY - h * 0.7} ${tipX} ${tipY}`
        }));
        const leafD = 'M0 0 C8 -16 30 -18 42 -4 C30 10 10 10 0 0Z';
        [[-38, 1], [-142, -1]].forEach(([rot, flip], i) => {
          const g = make('g', { transform: `translate(${tipX} ${tipY}) rotate(${rot})` });
          g.appendChild(make('path', {
            class: 'leaf', d: leafD,
            style: `--d:${delay + 0.9 + i * 0.15}s` + (flip === -1 ? ';' : '')
          }));
          group.appendChild(g);
        });
        // ورقة صغيرة في نص الساق
        const mid = make('g', { transform: `translate(${x + lean * 0.35} ${baseY - h * 0.55}) rotate(-20) scale(.6)` });
        mid.appendChild(make('path', { class: 'leaf', d: leafD, style: `--d:${delay + 0.7}s` }));
        group.appendChild(mid);
      }

      function buildSprouts() {
        const group = document.getElementById('sprouts');
        const t = document.getElementById('clipText');
        let xs = [];
        try {
          [1, 2].forEach(i => { const e = t.getExtentOfChar(i); if (e.width > 0) xs.push(e.x + e.width / 2); });
        } catch (e) { /* نستخدم أماكن احتياطية */ }
        if (xs.length < 2) xs = [415, 370];
        addSprout(group, xs[0], 92, -10, 2.5);
        addSprout(group, xs[1], 112, 12, 2.75);
      }

      function start() {
        buildSprouts();
        intro.classList.add('play');
        setTimeout(closeIntro, 5200);
      }

      // نستنى الخط يتحمل عشان أماكن الشتلات تطلع صح
      const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      Promise.race([fontsReady, new Promise(r => setTimeout(r, 1500))]).then(start);
    })();
</script>
